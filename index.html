<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>西柚音游节 | Citrus Rhythm Game Festival</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./content.js" defer></script>
  <script src="./program.js" defer></script>
  <script src="./main.js" defer></script>
</head>
<body>
  <!-- 固定的霓虹氛围层：不跟随页面滚动；与随页面滚动的网格分离。 -->
  <div class="site-ambient" aria-hidden="true">
    <div class="bg-gradient"></div>
    <span class="bg-orb bg-orb--cyan"></span>
    <span class="bg-orb bg-orb--violet"></span>
    <span class="bg-orb bg-orb--teal"></span>
  </div>
  <!-- 网格、呼吸方块与数字纹理沿文档深度铺开。 -->
  <div class="site-background" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
  </div>
  <!-- 与粘性页首分离：#top始终指向文档真实顶部。 -->
  <span id="top" class="top-anchor" aria-hidden="true"></span>
  <header class="site-header">
    <a id="site-brand" class="site-brand" href="#top" aria-label="返回页首"></a>
    <button id="nav-toggle" class="nav-toggle" type="button"
      aria-expanded="false" aria-controls="site-nav" aria-label="展开导航菜单">
      <span class="nav-toggle-line"></span><span class="nav-toggle-line"></span><span class="nav-toggle-line"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="页面导航"></nav>
  </header>

  <!-- 全宽首屏：双对角信息块；中央留出后续视觉效果带的空间。 -->
  <section id="hero" class="site-hero" aria-label="2026西柚音游节主视觉">
    <div id="hero-art" class="hero-art" aria-hidden="true"></div>
    <div id="hero-content" class="hero-content"></div>
  </section>

  <!-- 首屏与正文分界处的双向滚动编码带。 -->
  <div id="hero-ticker" class="hero-ticker" aria-hidden="true"></div>

  <main id="app">
    <section id="intro" class="page-section" aria-labelledby="intro-heading">
      <h2 id="intro-heading" class="page-section-heading"></h2>
      <div id="intro-content" class="intro-content"></div>
    </section>

    <section id="schedule" class="page-section" aria-labelledby="schedule-heading">
      <h2 id="schedule-heading" class="page-section-heading"></h2>
      <div id="schedule-content" class="schedule-content"></div>
    </section>

    <section id="tournament" class="page-section" aria-labelledby="tournament-heading">
      <h2 id="tournament-heading" class="page-section-heading"></h2>
      <div id="tournament-content" class="tournament-content"></div>
    </section>

    <section id="salon" class="page-section" aria-labelledby="salon-heading">
      <h2 id="salon-heading" class="page-section-heading"></h2>
      <div id="salon-content" class="salon-content"></div>
    </section>

    <section id="submissions" class="page-section" aria-labelledby="submissions-heading">
      <h2 id="submissions-heading" class="page-section-heading"></h2>
      <div id="submissions-content" class="submissions-content"></div>
    </section>

    <section id="experience" class="page-section" aria-labelledby="experience-heading">
      <h2 id="experience-heading" class="page-section-heading"></h2>
      <div id="experience-content" class="experience-content"></div>
    </section>

    <section id="faq" class="page-section" aria-labelledby="faq-heading">
      <h2 id="faq-heading" class="page-section-heading"></h2>
      <div id="faq-content" class="faq-content"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
